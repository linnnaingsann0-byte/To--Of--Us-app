name: Build Two of Us APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q Two_of_Us_Final_Source_v6_APK_Builder.zip -x ".github/workflows/android-apk.yml"
          rm -f Two_of_Us_Final_Source_v6_APK_Builder.zip

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Capacitor
        run: npm install --no-save @capacitor/core @capacitor/cli @capacitor/android

      - name: Build web app
        run: npm run build:dev

      - name: Prepare web assets
        run: |
            mkdir -p dist/client
    if [ -d ".vercel/output/static" ]; then
      cp -R .vercel/output/static/. dist/client/
    elif [ -d ".output/public" ]; then
      cp -R .output/public/. dist/client/
    else
      echo "Web output directory not found"
      find . -maxdepth 5 -name index.html -print
      exit 1
    fi

      - name: Add Android
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Two-of-Us-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

